name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mapi-migrate
        env:
          MAPI_DB_PATH: ${{ runner.temp }}/mapi-ci.db
      - run: mapi-seed-demo
        env:
          MAPI_DB_PATH: ${{ runner.temp }}/mapi-ci.db
      - run: mapi-doctor
        env:
          MAPI_DB_PATH: ${{ runner.temp }}/mapi-ci.db
      - run: pytest
      - run: ruff check .
      - run: mapi-capabilities
      - run: git diff --exit-code -- docs/CAPABILITIES.md
      - run: python scripts/audit_public_repository.py
