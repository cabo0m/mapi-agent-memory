name: Installation problem
description: Get help with installation or startup.
title: "[Install]: "
labels: [installation]
body:
  - type: input
    id: os
    attributes: {label: Operating system}
    validations: {required: true}
  - type: input
    id: python
    attributes: {label: Python version}
    validations: {required: true}
  - type: input
    id: client
    attributes: {label: Intended MCP client}
    validations: {required: true}
  - type: input
    id: install
    attributes: {label: Installation command or method}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes: {label: Sanitized mapi-doctor output or reason it could not run}
    validations: {required: true}
  - type: textarea
    id: error
    attributes: {label: Sanitized error and attempted fixes}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, tokens, private paths and private memory content.
          required: true
