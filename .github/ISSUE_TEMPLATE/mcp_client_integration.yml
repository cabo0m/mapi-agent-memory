name: MCP client integration
description: Report a client connection or protocol issue.
title: "[MCP client]: "
labels: [integration]
body:
  - type: input
    id: os
    attributes: {label: Operating system}
    validations: {required: true}
  - type: input
    id: python
    attributes: {label: Python version}
    validations: {required: true}
  - type: input
    id: client
    attributes: {label: MCP client, version and plan if relevant}
    validations: {required: true}
  - type: input
    id: install
    attributes: {label: Installation method}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes: {label: Sanitized mapi-doctor and smoke output}
    validations: {required: true}
  - type: textarea
    id: config
    attributes: {label: Sanitized client configuration and error}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, tokens, private paths and private memory content.
          required: true
