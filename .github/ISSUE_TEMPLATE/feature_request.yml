name: Feature request
description: Propose a scoped improvement and its lifecycle or security impact.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: input
    id: os
    attributes: {label: Operating system}
    validations: {required: true}
  - type: input
    id: python
    attributes: {label: Python version}
    validations: {required: true}
  - type: input
    id: client
    attributes: {label: MCP client and version}
    validations: {required: true}
  - type: input
    id: install
    attributes: {label: Installation method}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes: {label: Sanitized mapi-doctor output}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Problem, proposed behavior and alternatives}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, tokens, private paths and private memory content.
          required: true
