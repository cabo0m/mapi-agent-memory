[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -p no:cacheprovider --basetemp=.pytest_tmp
markers =
    smoke: fast checks for essential scenarios
    regression: regression coverage for memory, Sandman, duplicates, and conflicts
    slow: slower tests or multi-step scenarios
    semantic: requires the semantic optional extra
